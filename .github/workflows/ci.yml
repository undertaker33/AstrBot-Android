name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
  TZ: Asia/Shanghai

jobs:
  tooling:
    name: Build tooling and repository guards
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version --console=plain --no-daemon

      - name: Verify generated artifacts are not tracked
        run: |
          if git ls-files 'artifacts/**' | grep -q .; then
            echo "::error::Generated artifacts must not be tracked under artifacts/"
            git ls-files 'artifacts/**'
            exit 1
          fi

      - name: Run build logic checks
        run: ./gradlew :build-logic:check --console=plain --no-daemon --stacktrace

  module-boundary-checks:
    name: Plugin and QQ module checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: tooling

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run plugin and QQ module checks
        run: ./gradlew modulePluginCheck moduleQqCheck --console=plain --no-daemon --stacktrace

  architecture-and-assemble:
    name: Architecture contracts and debug assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - tooling
      - module-boundary-checks
      - app-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run architecture and debug assemble gate
        run: ./gradlew clean architectureCheck assembleDebug --console=plain --no-daemon --stacktrace

  app-tests:
    name: App debug unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tooling

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run app debug unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon --stacktrace
